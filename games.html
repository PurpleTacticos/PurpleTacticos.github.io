<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Games - Football Community</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <nav class="nav-bar">
    <div class="brand">
      <img src="/images/logo.png" alt="Logo" class="logo">
      <h1>Football Games</h1>
    </div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/trending.html">Trending</a>
      <a href="/games.html" class="active">Games</a>
      <button id="darkModeToggle"><i class="fas fa-moon"></i></button>
    </div>
  </nav>

  <div class="section-container">
    <h2>Featured Football Games</h2>
    <div class="game-grid">
      <div class="game-card">
        <div class="game-preview" style="background-image: url('/games/connections.jpg');">
          <div class="game-overlay">
            <button class="btn primary" onclick="playGame('/games/connections.html')">
              Play Now <i class="fas fa-play"></i>
            </button>
          </div>
        </div>
        <h3>Club Connections</h3>
        <p>Connect football clubs through their shared history and rivalries</p>
      </div>

      <div class="game-card">
        <div class="game-preview" style="background-image: url('/games/bingo.jpg');">
          <div class="game-overlay">
            <button class="btn primary" onclick="playGame('/games/bingo.html')">
              Play Now <i class="fas fa-play"></i>
            </button>
          </div>
        </div>
        <h3>Transfer Bingo</h3>
        <p>Predict summer transfers and mark them off your bingo card</p>
      </div>
    </div>
  </div>

  <!-- Game Modal -->
  <div class="game-modal" id="gameModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">×</span>
      <iframe id="gameFrame" src="" frameborder="0"></iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.6/dist/purify.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
